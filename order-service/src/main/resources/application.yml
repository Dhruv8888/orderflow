spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/orderflow?createDatabaseIfNotExist=true
    username: orderflow
    password: orderflow
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

inventory-service:
  base-url: http://localhost:8082

kafka:
  bootstrap-servers: localhost:9092
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
